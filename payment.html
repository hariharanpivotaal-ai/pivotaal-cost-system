<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#D85A30">
<title>Pivotaal — Payment Entry</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1D9E75;--teal-d:#0F6E56;--teal-l:#E1F5EE;
  --coral:#D85A30;--coral-d:#B8431F;--coral-l:#FAECE7;
  --amber:#BA7517;--amber-l:#FAEEDA;
  --blue:#185FA5;--blue-l:#E6F1FB;
  --text:#1C1C1A;--text2:#6B6A66;--text3:#9B9A96;
  --bg:#F4F7F5;--surface:#fff;
  --border:#DDE8E4;--radius:16px;--radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
.header{background:linear-gradient(135deg,var(--coral-d) 0%,var(--coral) 100%);padding:20px 20px 28px;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:rgba(255,255,255,.06);border-radius:50%}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;position:relative;z-index:1}
.logo{width:38px;height:38px;background:rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.header-date{font-size:12px;color:rgba(255,255,255,.75);font-weight:500}
.header-title{font-size:22px;font-weight:700;color:#fff;position:relative;z-index:1}
.header-sub{font-size:13px;color:rgba(255,255,255,.7);margin-top:3px;position:relative;z-index:1}
.body{padding:20px 16px}
.loading{text-align:center;padding:40px 20px}
.spinner{width:36px;height:36px;border:3px solid var(--coral-l);border-top-color:var(--coral);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--text3)}
.card{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card-title{font-size:11px;font-weight:700;color:var(--coral);letter-spacing:.8px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:6px}
.card-title::before{content:'';width:3px;height:14px;background:var(--coral);border-radius:2px;display:inline-block}
.fg{margin-bottom:16px}.fg:last-child{margin-bottom:0}
.fl{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:7px}
.req{color:var(--coral);margin-left:2px}
.fi,.fs{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--surface);-webkit-appearance:none}
.fi:focus,.fs:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px rgba(216,90,48,.1)}
.fi.error,.fs.error{border-color:var(--coral)}
.fhint{font-size:11px;color:var(--text3);margin-top:5px}
.field-err{font-size:11px;color:var(--coral);margin-top:4px;display:none}
.num-wrap{position:relative}
.num-wrap .fi{padding-left:36px;font-size:22px;font-weight:700;font-family:'DM Mono',monospace}
.num-rupee{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--text3);font-weight:600;pointer-events:none}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.week-badge{display:inline-block;background:var(--coral-l);color:var(--coral-d);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:'DM Mono',monospace;margin-top:6px}
.cond-field{display:none}
.cond-field.show{display:block}
.add-vendor-btn{display:inline-flex;align-items:center;gap:4px;background:var(--teal-l);color:var(--teal-d);border:none;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px}
.submit-btn{width:100%;padding:17px;background:linear-gradient(135deg,var(--coral) 0%,var(--coral-d) 100%);color:#fff;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(184,67,31,.25)}
.submit-btn:active{transform:scale(.97)}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
#successScreen{display:none;text-align:center;padding:40px 20px}
.success-icon{width:72px;height:72px;background:var(--teal-l);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px}
.success-title{font-size:20px;font-weight:700;margin-bottom:6px}
.success-sub{font-size:14px;color:var(--text2);margin-bottom:8px}
.success-detail{background:var(--coral-l);border-radius:var(--radius-sm);padding:14px;margin:16px 0;text-align:left}
.sd-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid rgba(216,90,48,.12)}
.sd-row:last-child{border-bottom:none}
.sd-label{color:var(--coral-d);font-weight:500}
.sd-val{font-weight:600;font-family:'DM Mono',monospace}
.new-btn{width:100%;padding:15px;background:var(--surface);color:var(--coral);border:2px solid var(--coral);border-radius:var(--radius-sm);font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:12px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1C1C1A;color:#fff;padding:11px 22px;border-radius:22px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.on{display:flex}
.modal{background:#fff;border-radius:var(--radius);padding:22px;width:100%;max-width:380px}
.modal-title{font-size:17px;font-weight:700;margin-bottom:6px}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:16px}
.modal-btns{display:flex;gap:8px;margin-top:8px}
.modal-btn-cancel{flex:1;padding:13px;background:#fff;color:var(--text2);border:2px solid var(--border);border-radius:var(--radius-sm);font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.modal-btn-save{flex:1;padding:13px;background:var(--teal);color:#fff;border:none;border-radius:var(--radius-sm);font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">PB</div>
    <div class="header-date" id="headerDate"></div>
  </div>
  <div class="header-title">Payment Entry</div>
  <div class="header-sub">Pivotaal Branding Solutions</div>
</div>

<div class="body">
  <div id="loadingState" class="loading"><div class="spinner"></div><div class="loading-text">Loading...</div></div>

  <div id="formArea" style="display:none">

    <div class="card">
      <div class="card-title">Payment details</div>

      <div class="fg">
        <label class="fl">Date <span class="req">*</span></label>
        <input type="date" class="fi" id="f-date">
        <div class="week-badge" id="weekBadge"></div>
      </div>

      <div class="fg">
        <label class="fl">Payment type <span class="req">*</span></label>
        <select class="fs" id="f-paytype" onchange="onTypeChange()">
          <option value="">— select —</option>
        </select>
        <div class="field-err" id="err-paytype">Required</div>
      </div>

      <!-- CONDITIONAL: VENDOR (for Vendor payment, Advance to vendor) -->
      <div class="cond-field" id="vendorField">
        <div class="fg">
          <label class="fl">Vendor <span class="req">*</span></label>
          <select class="fs" id="f-vendor"><option value="">— select vendor —</option></select>
          <button class="add-vendor-btn" type="button" onclick="openAddVendor()">+ Add new vendor</button>
        </div>
      </div>

      <!-- CONDITIONAL: CONTRACTOR (for Labour advance, Labour settlement) -->
      <div class="cond-field" id="contractorField">
        <div class="fg">
          <label class="fl">Contractor <span class="req">*</span></label>
          <select class="fs" id="f-contractor"><option value="">— select contractor —</option></select>
        </div>
      </div>

      <!-- CONDITIONAL: EXPENSE HEAD (for Direct or Indirect expense) -->
      <div class="cond-field" id="expHeadField">
        <div class="fg">
          <label class="fl" id="expHeadLabel">Expense head <span class="req">*</span></label>
          <select class="fs" id="f-exphead"><option value="">— select —</option></select>
        </div>
      </div>

      <!-- CONDITIONAL: FREE TEXT PARTY (for Other) -->
      <div class="cond-field" id="partyField">
        <div class="fg">
          <label class="fl">Paid to <span class="req">*</span></label>
          <input type="text" class="fi" id="f-party" placeholder="Party name">
        </div>
      </div>

      <div class="fg">
        <label class="fl">Amount <span class="req">*</span></label>
        <div class="num-wrap">
          <span class="num-rupee">₹</span>
          <input type="number" class="fi" id="f-amount" placeholder="0" inputmode="numeric">
        </div>
        <div class="field-err" id="err-amount">Required</div>
      </div>

      <div class="fg">
        <label class="fl">Payment mode <span class="req">*</span></label>
        <select class="fs" id="f-mode">
          <option value="">— select —</option>
        </select>
        <div class="field-err" id="err-mode">Required</div>
      </div>
    </div>

    <!-- CONDITIONAL: Order tag -->
    <div class="card cond-field" id="orderCard">
      <div class="card-title">Tag to order</div>
      <div class="fg">
        <label class="fl" id="orderLabel">Order no</label>
        <select class="fs" id="f-order">
          <option value="">— select order —</option>
        </select>
        <div class="fhint" id="orderHint">If tagged, payment counts toward order cost</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Reference</div>
      <div class="fg">
        <label class="fl">Reference no (optional)</label>
        <input type="text" class="fi" id="f-ref" placeholder="UTR / cheque / txn id">
      </div>
      <div class="fg">
        <label class="fl">Entered by <span class="req">*</span></label>
        <select class="fs" id="f-enteredby">
          <option value="">— select —</option>
        </select>
        <div class="field-err" id="err-enteredby">Required</div>
      </div>
      <div class="fg">
        <label class="fl">Notes (optional)</label>
        <input type="text" class="fi" id="f-notes" placeholder="Any note">
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitPayment()">Save payment</button>
  </div>

  <div id="successScreen">
    <div class="success-icon">✓</div>
    <div class="success-title">Payment saved!</div>
    <div class="success-sub">Kavya will verify this entry.</div>
    <div class="success-detail" id="successDetail"></div>
    <button class="new-btn" onclick="resetForm()">+ New payment</button>
  </div>
</div>

<!-- ADD VENDOR MODAL -->
<div class="modal-overlay" id="vendorModal">
  <div class="modal">
    <div class="modal-title">Add new vendor</div>
    <div class="modal-sub">Quick add — only name required</div>
    <div class="fg">
      <label class="fl">Vendor name <span class="req">*</span></label>
      <input type="text" class="fi" id="v-name" placeholder="e.g. Sri Lakshmi Fabrics">
    </div>
    <div class="fg">
      <label class="fl">Phone (optional)</label>
      <input type="text" class="fi" id="v-phone" placeholder="98xxx xxxxx" inputmode="numeric">
    </div>
    <div class="fg">
      <label class="fl">GST no (optional)</label>
      <input type="text" class="fi" id="v-gst" placeholder="33XXXXX">
    </div>
    <div class="modal-btns">
      <button class="modal-btn-cancel" onclick="closeAddVendor()">Cancel</button>
      <button class="modal-btn-save" onclick="saveVendor()">Save vendor</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyMJUO-eXiq-2LrSZWELtTeEvGw-Ev2_XkH2vcKltKAGfva8qNkVDDNUL6FO8STH_Eubg/exec';
const SECRET = 'pivotaal2025xyz';

var master = {};
var groupOrders = [];
var vendors = [];
var expHeads = { direct:[], indirect:[] };

function fetchData(action, params) {
  return new Promise(function(resolve, reject) {
    var cb = 'cb_'+action+'_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    var script = document.createElement('script');
    var url = SCRIPT_URL+'?key='+SECRET+'&action='+action+'&callback='+cb;
    if (params) Object.keys(params).forEach(function(k){ url+='&'+k+'='+encodeURIComponent(params[k]); });
    var cleanup=function(){ try{ if(script&&script.parentNode) script.parentNode.removeChild(script); }catch(e){} };
    window[cb]=function(data){ try{delete window[cb];}catch(e){window[cb]=undefined;} cleanup(); resolve(data); };
    script.onerror=function(){ try{delete window[cb];}catch(e){window[cb]=undefined;} cleanup(); reject(new Error('Failed')); };
    script.src=url;
    (document.head||document.documentElement).appendChild(script);
    setTimeout(function(){ if(window[cb]){ try{delete window[cb];}catch(e){window[cb]=undefined;} cleanup(); reject(new Error('Timeout')); } },15000);
  });
}

window.addEventListener('load', function() {
  var t = new Date().toISOString().slice(0,10);
  document.getElementById('f-date').value = t;
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'});
  updateWeek(t);
  document.getElementById('f-date').addEventListener('change', function(){ updateWeek(this.value); });
  loadWithRetry();
});

function updateWeek(d){ if(!d)return; var dt=new Date(d),j=new Date(dt.getFullYear(),0,1); var wk=Math.ceil(((dt-j)/86400000+j.getDay()+1)/7); document.getElementById('weekBadge').textContent='Week '+wk+' — '+dt.getFullYear(); }

async function loadWithRetry(n){ n=n||1; try{ await loadData(); }catch(e){ if(n<4) setTimeout(function(){loadWithRetry(n+1);},1500); else document.getElementById('loadingState').innerHTML='<div style="color:var(--coral);text-align:center">Could not load. Refresh.</div>'; } }

async function loadData() {
  master = await fetchData('masters');
  groupOrders = await fetchData('grouporders');
  vendors = await fetchData('vendorslist');
  expHeads = await fetchData('expheads');

  // Payment types — hardcoded with fallback
  var pt = document.getElementById('f-paytype');
  pt.innerHTML='<option value="">— select —</option>';
  (master.paymentTypes||['Vendor payment','Advance to vendor','Labour advance','Labour settlement','Direct expense','Indirect expense','Other']).forEach(function(n){ var o=document.createElement('option');o.value=n;o.textContent=n;pt.appendChild(o); });

  // Payment modes
  fillSelect('f-mode', master.paymentModes||[]);
  // Entered by
  fillSelect('f-enteredby', master.teamMembers||[]);
  // Contractor
  fillSelect('f-contractor', master.contractors||[]);
  // Order dropdown
  var od = document.getElementById('f-order');
  od.innerHTML='<option value="">— select order —</option>';
  groupOrders.forEach(function(label){ var o=document.createElement('option');o.value=label;o.textContent=label;od.appendChild(o); });

  refreshVendorDropdown();

  document.getElementById('loadingState').style.display='none';
  document.getElementById('formArea').style.display='block';
}

function fillSelect(id, arr) {
  var el = document.getElementById(id);
  el.innerHTML='<option value="">— select —</option>';
  arr.forEach(function(n){ var o=document.createElement('option');o.value=n;o.textContent=n;el.appendChild(o); });
}

function refreshVendorDropdown(){
  var v = document.getElementById('f-vendor');
  v.innerHTML='<option value="">— select vendor —</option>';
  vendors.forEach(function(ven){ var o=document.createElement('option');o.value=ven.name;o.textContent=ven.name;v.appendChild(o); });
}

// Smart conditional based on payment type
function onTypeChange() {
  var type = document.getElementById('f-paytype').value;
  hideAll();
  if (type==='Vendor payment' || type==='Advance to vendor') {
    show('vendorField');
    show('orderCard');
    setOrderTag('Tag to order (optional)','Tag is reference only. Cost comes from Purchase entry, not double counted.');
  }
  else if (type==='Labour advance' || type==='Labour settlement') {
    show('contractorField');
    show('orderCard');
    setOrderTag('Tag to order (optional)','Reference only.');
  }
  else if (type==='Direct expense') {
    fillSelect('f-exphead', expHeads.direct||[]);
    document.getElementById('expHeadLabel').innerHTML='Expense head <span class="req">*</span>';
    show('expHeadField');
    show('orderCard');
    setOrderTag('Tag to order — required','Direct expense IS counted as order cost.', true);
  }
  else if (type==='Indirect expense') {
    fillSelect('f-exphead', expHeads.indirect||[]);
    document.getElementById('expHeadLabel').innerHTML='Expense head <span class="req">*</span>';
    show('expHeadField');
    show('orderCard');
    setOrderTag('Tag to order (optional)','Overhead. Tag only if directly attributable to one order.');
  }
  else if (type==='Other') {
    show('partyField');
    show('orderCard');
    setOrderTag('Tag to order (optional)','Reference only.');
  }
}

function hideAll(){ ['vendorField','contractorField','expHeadField','partyField','orderCard'].forEach(function(id){ document.getElementById(id).classList.remove('show'); }); }
function show(id){ document.getElementById(id).classList.add('show'); }
function setOrderTag(label, hint, required) {
  document.getElementById('orderLabel').innerHTML = label + (required?' <span class="req">*</span>':'');
  document.getElementById('orderHint').textContent = hint;
}

// ── ADD VENDOR MODAL ──────────────────────────────────────
function openAddVendor() {
  document.getElementById('v-name').value='';
  document.getElementById('v-phone').value='';
  document.getElementById('v-gst').value='';
  document.getElementById('vendorModal').classList.add('on');
  setTimeout(function(){ document.getElementById('v-name').focus(); }, 100);
}
function closeAddVendor() { document.getElementById('vendorModal').classList.remove('on'); }

async function saveVendor() {
  var name = document.getElementById('v-name').value.trim();
  if (!name) { showToast('Vendor name required'); return; }
  var phone = document.getElementById('v-phone').value.trim();
  var gst   = document.getElementById('v-gst').value.trim();
  try {
    await fetch(SCRIPT_URL, {method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:SECRET,type:'addvendor',data:{name:name,phone:phone,gstNo:gst}})});
    // Optimistic add to local list
    vendors.push({name:name, phone:phone, gstNo:gst, category:''});
    vendors.sort(function(a,b){ return a.name.localeCompare(b.name); });
    refreshVendorDropdown();
    document.getElementById('f-vendor').value = name;
    closeAddVendor();
    showToast('✅ Vendor added');
  } catch(e) { showToast('Failed, try again'); }
}

function validate() {
  var valid=true;
  var type = document.getElementById('f-paytype').value;
  if (!type) { document.getElementById('f-paytype').classList.add('error'); document.getElementById('err-paytype').style.display='block'; valid=false; }
  else { document.getElementById('f-paytype').classList.remove('error'); document.getElementById('err-paytype').style.display='none'; }

  ['f-amount','f-mode','f-enteredby'].forEach(function(id){
    var el=document.getElementById(id);
    var err=document.getElementById('err-'+id.replace('f-',''));
    if(!el.value){ el.classList.add('error'); if(err)err.style.display='block'; valid=false; }
    else { el.classList.remove('error'); if(err)err.style.display='none'; }
  });
  if((parseFloat(document.getElementById('f-amount').value)||0)<=0){ document.getElementById('f-amount').classList.add('error'); document.getElementById('err-amount').style.display='block'; valid=false; }

  // Conditional party validation
  if ((type==='Vendor payment'||type==='Advance to vendor') && !document.getElementById('f-vendor').value) { showToast('Select vendor'); valid=false; }
  if ((type==='Labour advance'||type==='Labour settlement') && !document.getElementById('f-contractor').value) { showToast('Select contractor'); valid=false; }
  if ((type==='Direct expense'||type==='Indirect expense') && !document.getElementById('f-exphead').value) { showToast('Select expense head'); valid=false; }
  if (type==='Other' && !document.getElementById('f-party').value) { showToast('Enter party name'); valid=false; }
  if (type==='Direct expense' && !document.getElementById('f-order').value) { showToast('Order required for direct expense'); valid=false; }

  return valid;
}

async function submitPayment() {
  if(!validate()) return;
  var btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Saving...';

  var type = document.getElementById('f-paytype').value;
  var party = '';
  var expenseCategory = '';
  if (type==='Vendor payment'||type==='Advance to vendor') party = document.getElementById('f-vendor').value;
  else if (type==='Labour advance'||type==='Labour settlement') party = document.getElementById('f-contractor').value;
  else if (type==='Direct expense'||type==='Indirect expense') { party = document.getElementById('f-exphead').value; expenseCategory = party; }
  else if (type==='Other') party = document.getElementById('f-party').value;

  var data = {
    date:           document.getElementById('f-date').value,
    paymentType:    type,
    party:          party,
    amount:         parseFloat(document.getElementById('f-amount').value)||0,
    paymentMode:    document.getElementById('f-mode').value,
    paymentAgainst: document.getElementById('f-order').value||'',
    expenseCategory:expenseCategory,
    referenceNo:    document.getElementById('f-ref').value||'',
    enteredBy:      document.getElementById('f-enteredby').value,
    notes:          document.getElementById('f-notes').value||'',
  };

  try {
    await fetch(SCRIPT_URL, {method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:SECRET,type:'payment',data:data})});
    showSuccess(data);
  } catch(e) { showToast('Error, try again'); btn.disabled=false; btn.textContent='Save payment'; }
}

function showSuccess(d) {
  document.getElementById('formArea').style.display='none';
  document.getElementById('successScreen').style.display='block';
  var html='';
  html+='<div class="sd-row"><span class="sd-label">Date</span><span class="sd-val">'+d.date+'</span></div>';
  html+='<div class="sd-row"><span class="sd-label">Type</span><span class="sd-val">'+d.paymentType+'</span></div>';
  html+='<div class="sd-row"><span class="sd-label">Paid to</span><span class="sd-val">'+d.party+'</span></div>';
  html+='<div class="sd-row"><span class="sd-label">Amount</span><span class="sd-val">₹'+Math.round(d.amount).toLocaleString('en-IN')+'</span></div>';
  html+='<div class="sd-row"><span class="sd-label">Mode</span><span class="sd-val">'+d.paymentMode+'</span></div>';
  if(d.paymentAgainst) html+='<div class="sd-row"><span class="sd-label">Order</span><span class="sd-val">'+d.paymentAgainst.split('—')[0].trim()+'</span></div>';
  html+='<div class="sd-row"><span class="sd-label">Status</span><span class="sd-val" style="color:var(--amber)">Pending verify</span></div>';
  document.getElementById('successDetail').innerHTML=html;
  window.scrollTo(0,0);
}

function resetForm() {
  document.getElementById('successScreen').style.display='none';
  document.getElementById('formArea').style.display='block';
  ['f-amount','f-ref','f-notes','f-party'].forEach(function(id){ document.getElementById(id).value=''; });
  ['f-paytype','f-vendor','f-contractor','f-exphead','f-order','f-mode'].forEach(function(id){ document.getElementById(id).value=''; });
  hideAll();
  var btn=document.getElementById('submitBtn'); btn.disabled=false; btn.textContent='Save payment';
  window.scrollTo(0,0);
}

function showToast(msg){ var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2500); }
</script>
